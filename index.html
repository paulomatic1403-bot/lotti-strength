<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lotti · Kraftplan</title>
<style>
:root{
  --bg:#111315; --surface:#1a1d20; --surface2:#23272b; --line:#2e3338;
  --text:#eef0f2; --muted:#9aa3ab; --faint:#6b747c;
  --accent:#d9f24a; --accent-ink:#151a00;
  --up:#4ade80; --down:#f87171; --warn:#fbbf24;
  --radius:14px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f4f2; --surface:#ffffff; --surface2:#eceee9; --line:#dcdfd8;
    --text:#14171a; --muted:#5d666e; --faint:#8a929a;
    --accent:#3f5f00; --accent-ink:#ffffff;
    --up:#15803d; --down:#b91c1c; --warn:#a16207;
  }
}
:root[data-theme="light"]{
  --bg:#f3f4f2; --surface:#ffffff; --surface2:#eceee9; --line:#dcdfd8;
  --text:#14171a; --muted:#5d666e; --faint:#8a929a;
  --accent:#3f5f00; --accent-ink:#ffffff;
  --up:#15803d; --down:#b91c1c; --warn:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* Header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 0 8px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:20px}
.brand small{font-weight:600;color:var(--muted);font-size:13px;margin-left:6px}
.weeks{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums;position:relative}
.wk.deload{border-style:dashed}
.wk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wk .dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--up)}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-bottom:12px}
.day{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.day.on{background:var(--text);color:var(--bg);border-color:var(--text)}

.session{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 0 8px}
.s-title{font-size:24px;font-weight:800;letter-spacing:-.02em}
.s-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pickBtn{flex:0 0 auto;height:40px}
.progress{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
#picker{padding-top:4px}
.banner{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--surface2);font-size:14px;line-height:1.4}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.stage{display:flex;align-items:center;gap:8px;margin:14px 0 6px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stage .num{width:20px;height:20px;border-radius:50%;background:var(--text);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.single-row{display:flex;align-items:center;gap:8px}
.single-row .unit{color:var(--muted);font-weight:700}
.single-row input{font-size:20px!important;font-weight:700}
.card .hint b{color:var(--text)}
.finish{margin:22px 0 8px}
.finish.done-state{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border-radius:var(--radius);border:1px solid color-mix(in srgb,var(--up) 55%,var(--line));color:var(--up)}
.btn.big{width:100%;height:56px;font-size:17px;border-radius:14px}
/* Session-Timer */
.sessbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;padding:8px 8px 8px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.sessbar .clock{font-family:var(--mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sessbar .clock.paused{color:var(--faint)}
.sessbar .lbl{font-size:12px;color:var(--muted);font-weight:600}
.sessbar .btns{display:flex;gap:6px}
.sessbar .btn{height:40px;padding:0 14px}
/* Zusammenfassung */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 2px;font-size:24px;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .k{font-size:11px;color:var(--faint);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .v small{font-size:14px;color:var(--muted);font-weight:600;margin-left:2px}
.pb{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid color-mix(in srgb,var(--up) 50%,var(--line));margin-bottom:6px;font-size:14px}
.pb .ic{font-size:18px;line-height:1}
.sumrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sumrow .n{font-weight:700}
.sumrow .d{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
/* Charts */
.chart-card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chart-card .big{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chart-card .big small{font-size:14px;color:var(--muted);font-weight:600}
.delta{font-size:13px;font-weight:700}
.delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.keep{color:var(--muted)}
.chart{position:relative;margin-top:4px;padding-top:28px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;top:0;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .1s}
.chart .tip.show{opacity:1}
/* Cards */
.weekinfo-unused{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 8px;color:var(--muted);font-size:13px}
.weekinfo b{color:var(--text);font-size:15px}
.section-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:22px 2px 8px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.card.done{border-color:color-mix(in srgb,var(--up) 55%,var(--line))}
.c-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.c-name{font-weight:800;font-size:17px;letter-spacing:-.01em}
.c-tm{font-size:12px;color:var(--muted);font-family:var(--mono);white-space:nowrap;padding-top:3px}
.presc{display:flex;align-items:baseline;gap:8px;margin:10px 0 2px;flex-wrap:wrap}
.presc .w{font-size:34px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.presc .w small{font-size:15px;font-weight:600;color:var(--muted);margin-left:2px}
.presc .x{font-size:22px;color:var(--muted);font-weight:700}
.presc .r{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);font-weight:600}
.chip b{color:var(--text)}

.sets{display:flex;align-items:center;gap:10px;margin-top:14px}
.sets .lbl{font-size:13px;color:var(--muted);flex:1}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2)}
.stepper button{width:48px;height:48px;border:0;background:transparent;font-size:24px;font-weight:700}
.stepper button:active{background:var(--line)}
.stepper .n{min-width:44px;text-align:center;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.setdots{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.setdots span{width:22px;height:8px;border-radius:4px;background:var(--surface2);border:1px solid var(--line)}
.setdots span.f{background:var(--accent);border-color:var(--accent)}
.setdots span.over{background:var(--up);border-color:var(--up)}
.prog{margin-top:10px;font-size:13px;font-weight:600;padding:8px 10px;border-radius:10px;background:var(--surface2)}
.prog.up{color:var(--up)} .prog.down{color:var(--down)} .prog.keep{color:var(--muted)}

details.more{margin-top:10px}
details.more summary{list-style:none;font-size:13px;color:var(--muted);cursor:pointer;padding:6px 0;font-weight:600}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"＋ ";}
details.more[open] summary::before{content:"－ ";}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:11px;color:var(--faint);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.f input,.f select,.f textarea{width:100%;min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);padding:0 10px;font-size:16px}
.f textarea{height:auto;min-height:64px;padding:10px;resize:vertical}
.f input::placeholder{color:var(--faint)}
.f input.carried{color:var(--muted)}
.namesel{font-weight:800;font-size:17px;color:var(--text);background-color:var(--surface2);border:1px solid var(--line);border-radius:10px;height:44px;padding:0 38px 0 12px;width:100%;max-width:100%;appearance:none;-webkit-appearance:none;text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) 19px,calc(100% - 14px) 19px;background-size:6px 6px;background-repeat:no-repeat}
.namesel.empty{color:var(--faint);font-weight:600}
.c-head .namesel{flex:1;min-width:0}
.iconbtn{flex:0 0 auto;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font-size:16px}
.addbtn{width:100%;height:52px;border-radius:var(--radius);border:1px dashed var(--line);background:transparent;color:var(--muted);font-weight:700;font-size:15px}
.nameinp{font-weight:800;font-size:17px;background:transparent;border:0;border-bottom:1px dashed var(--line);padding:2px 0;width:100%}
.hint{font-size:12px;color:var(--faint);margin-top:4px}
a.vid{color:var(--accent);font-size:13px;font-weight:600}

/* Bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding-top:8px;padding-bottom:8px}
nav.bottom button{height:48px;border-radius:12px;border:0;background:transparent;font-weight:700;color:var(--muted)}
nav.bottom button.on{background:var(--surface2);color:var(--text)}

/* Timer */
.timer{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.timer .fab{height:56px;min-width:56px;padding:0 18px;border-radius:28px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:18px;box-shadow:0 6px 20px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.timer .fab.run{background:var(--text);color:var(--bg)}
.timer .presets{display:none;gap:6px}
.timer.open .presets{display:flex}
.timer .presets button{height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-weight:700}

/* Setup */
.row{display:flex;gap:8px;align-items:center}
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--down)}
table.prog-t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;margin-top:8px}
table.prog-t th{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:4px}
table.prog-t td{padding:3px 4px}
table.prog-t td:first-child{color:var(--muted);font-weight:700;width:36px}
table.prog-t input{width:100%;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);padding:0 8px;font-size:15px}
.hidden{display:none!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.week-table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.week-table th,.week-table td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.week-table th:first-child,.week-table td:first-child{text-align:left}
.week-table th{font-size:11px;color:var(--faint);text-transform:uppercase}
.overview-scroll{overflow-x:auto}
/* Lotti – Ergänzungen */
.days{grid-template-columns:repeat(5,1fr)}
.day{font-size:13px;padding:0 2px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prog.warn{color:var(--warn)}
.painrow{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.pain{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:13px;padding:0;font-variant-numeric:tabular-nums}
.pain.pg.on{background:var(--up);border-color:var(--up);color:#0b1a10}
.pain.py.on{background:var(--warn);border-color:var(--warn);color:#1f1600}
.pain.pr.on{background:var(--down);border-color:var(--down);color:#fff}
.yn{display:flex;gap:6px}
.yn .btn{min-width:64px}
.btn.on-no{background:var(--text);color:var(--bg);border-color:var(--text)}
button.chip{border:0;cursor:pointer}
.restchip{color:var(--accent)!important}
.week-table tr.cur td{color:var(--accent);font-weight:700}
.tup{color:var(--up)} .twarn{color:var(--warn)} .tdown{color:var(--down)}
.settable{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.setrow{display:grid;grid-template-columns:22px 1fr auto 1fr auto;gap:6px;align-items:center}
.setrow .sn{width:22px;height:22px;border-radius:50%;background:var(--surface2);color:var(--muted);font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.setrow .unit{color:var(--muted);font-size:13px;font-weight:700}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">Lotti <small>Kraftplan · Offseason</small></div>
      <button class="btn" id="themeBtn" aria-label="Design wechseln" style="height:36px;padding:0 12px">◐</button>
    </div>
    <div id="trainHeader">
      <div class="session">
        <div style="min-width:0">
          <div class="s-title" id="sTitle"></div>
          <div class="s-sub" id="sSub"></div>
        </div>
        <button class="btn" id="pickBtn" aria-expanded="false">Plan ▾</button>
      </div>
      <div class="progress"><span id="progBar"></span></div>
      <div class="s-sub" id="progTxt" style="margin:4px 0 10px"></div>
      <div id="picker" class="hidden">
        <div class="weeks" id="weeks"></div>
        <div class="days" id="days"></div>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="viewTrain"></section>
  <section id="viewOverview" class="hidden"></section>
  <section id="viewSetup" class="hidden"></section>
</main>

<div class="timer" id="timer">
  <div class="presets">
    <button data-s="60">1:00</button><button data-s="90">1:30</button><button data-s="120">2:00</button><button data-s="180">3:00</button>
  </div>
  <button class="fab" id="fab" aria-label="Pausentimer">⏱</button>
</div>

<nav class="bottom"><div class="wrap">
  <button data-v="Train" class="on">Training</button>
  <button data-v="Overview">Übersicht</button>
  <button data-v="Setup">Setup</button>
</div></nav>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Programmdaten – identisch zur Excel-Datei "Trainingsplan_Lotti.xlsx"
   (SBS Program Builder: Quick Setup / Setup / Program)
   ============================================================ */
const WEEKS = 21;
const START = new Date(2026, 10, 2); // Mo 02.11.2026
/* Intensität (% TM), Wdh. und RIR-Grenze je Woche – Hauptübungen bzw. Unterstützungsübungen */
const MAIN_T = {
  i:[70,75,80,72.5,77.5,82.5,60,75,80,85,77.5,82.5,87.5,60,80,85,90,85,90,95,60],
  r:[5,4,3,5,4,3,7,4,3,2,4,3,2,7,3,2,1,2,1,1,7],
  q:[3,3,2,3,3,2,4,3,2,2,3,2,2,4,2,2,1,2,1,1,4]
};
const VAR_T = {
  i:[60,65,70,62.5,67.5,72.5,50,65,70,75,67.5,72.5,77.5,50,70,75,80,75,80,85,50],
  r:[7,6,5,7,6,5,8,6,5,4,6,5,4,8,5,4,3,4,3,2,8],
  q:[4,4,3,4,4,3,5,4,3,3,4,3,3,5,3,3,2,3,2,2,5]
};
const DELOAD = new Set([7,14,21]);
/* Deload (Excel: Deload Details): 4 Sätze × 5 Wdh. bei 60 % TM, TM danach unverändert */
const DL = {sets:4, reps:5, int:60};
/* TM-Anpassung nach geschafften Sätzen (2+ unter / 1 unter / im Ziel / 1 über / 2+ über) */
const STEP = {b2:-0.05, b1:-0.05, a1:0.01, a2:0.02};

const LIFTS = {
  squat:{name:"Kniebeuge",            type:"main", lower:3, upper:5, knee:true, rest:210, restTxt:"3–4 min"},
  bench:{name:"Bankdrücken",          type:"main", lower:4, upper:6, rest:150, restTxt:"2–3 min"},
  dead: {name:"Kreuzheben",           type:"main", lower:3, upper:5, knee:true, rest:210, restTxt:"3–4 min"},
  ohp:  {name:"Schulterdrücken (OHP)",type:"main", lower:4, upper:6, rest:150, restTxt:"2–3 min"},
  pp:   {name:"Push Press",           type:"var",  lower:3, upper:5, rest:150, restTxt:"2–3 min", note:"explosiv – Kraftentwicklung"},
  ext:  {name:"Beinstrecker",         type:"var",  lower:4, upper:6, knee:true, rest:105, restTxt:"90 s–2 min"},
  curl: {name:"Beinbeuger",           type:"var",  lower:4, upper:6, knee:true, rest:105, restTxt:"90 s–2 min"}
};
/* Hypertrophie: feste Sätze, 8–10 Wdh., RIR 0–2 – bei 10 Wdh. +2,5 kg, zurück auf 8 */
const HYP = {
  row: {name:"Rudern",     sets:4},
  lat: {name:"Lat-Zug",    sets:3},
  face:{name:"Facepulls",  sets:5},
  jack:{name:"Klappmesser",sets:3, bw:true}
};
/* Feste Übungen (Halle & Vorübungen) */
const ST = {
  spanish:{name:"Spanish Squat isometrisch", presc:"3 × 45 s", rest:60, restTxt:"60 s", knee:true},
  wall:   {name:"Wandsitzen", presc:"2 × 1 min", rest:60, restTxt:"60 s", knee:true},
  broad:  {name:"Standweitsprung", presc:"3 × 3 Sprünge", tip:"maximale Weite", rest:90, restTxt:"90 s", knee:true, res:"Bestweite (cm)"},
  pogo:   {name:"Pogo Jumps", presc:"3 × 10", tip:"maximale Reaktivität, kurzer Bodenkontakt", rest:75, restTxt:"60–90 s", knee:true},
  mbrot:  {name:"Medizinball Rotationswurf VH/RH", presc:"3 × 5 pro Seite", tip:"2 kg · maximale Wurfkraft", rest:60, restTxt:"60 s"},
  mbover: {name:"Medizinball Überkopfwurf", presc:"3 × 5", tip:"2 kg · maximale Wurfkraft", rest:60, restTxt:"60 s"},

  extiso: {name:"Beinstrecker isometrisch", presc:"2 × 45 s pro Bein", tip:"einbeinig · vor den Wiederholungen", rest:60, restTxt:"60 s", knee:true, res:"Last (kg)"}
};
/* Einheiten pro Woche */
const DAYS = [
  {short:"Mo",    title:"Montag · Halle",     sub:"nach dem Turnen · Kniereha + Plyometrie",
   items:[["Kniereha","st","spanish"],["Kniereha","st","wall"],["Plyometrie","st","broad"],["Plyometrie","st","pogo"]]},
  {short:"Do",    title:"Donnerstag · Halle", sub:"nach dem Turnen",
   items:[["Würfe","st","mbrot"],["Würfe","st","mbover"],["Beine","st","bss"]]},
  {short:"Gym A", title:"Gym A",              sub:"Kniebeuge · Bankdrücken",
   items:[["Hauptübungen","lift","squat"],["Hauptübungen","lift","bench"],["Unterstützung","push"],["Hypertrophie","hyp","row"]]},
  {short:"Gym B", title:"Gym B",              sub:"Kreuzheben · Schulterdrücken",
   items:[["Hauptübungen","lift","dead"],["Hauptübungen","lift","ohp"],["Unterstützung","pull"],["Hypertrophie","hyp","lat"],["Hypertrophie","hyp","jack"]]},
  {short:"Gym C", title:"Gym C",              sub:"Push Press · Beine (knieschonend)",
   items:[["Hauptübung","lift","pp"],["Unterstützung","st","extiso"],["Unterstützung","lift","ext"],["Unterstützung","lift","curl"],["Hypertrophie","hyp","face"]]}
];
const ND = DAYS.length;

function defaultState(){
  return {
    v:1, rounding:2.5, pct:0.9,
    max:{squat:55, bench:45, dead:80, ohp:30, pp:"", ext:"", curl:""},
    hypStart:{row:"", lat:"", face:"", jack:0},
    pullStart:6,
    log:{}, done:{},
    ui:{week:1, day:0, view:"Train"}
  };
}

/* ============================================================
   Speicher
   ============================================================ */
const KEY = "lotti-kraftplan.offseason2026";
let S;
function load(){
  try{ const raw=localStorage.getItem(KEY); S=raw?JSON.parse(raw):defaultState(); }
  catch(e){ S=defaultState(); }
  const d=defaultState();
  for(const k in d) if(S[k]===undefined) S[k]=d[k];
  const c=currentSession(); S.ui.week=c.week; S.ui.day=c.day;
}
function save(){ clearCache(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function L(w,k){ if(!S.log[w]) S.log[w]={}; if(!S.log[w][k]) S.log[w][k]={}; return S.log[w][k]; }
function getL(w,k){ return (S.log[w]&&S.log[w][k])||{}; }
const has = v => v!==undefined && v!==null && v!=="";

/* ============================================================
   Berechnungen (identisch zu den Formeln der Excel-Datei)
   ============================================================ */
function mround(x,m){ if(!m) return x; const q=x/m; return Math.sign(q)*Math.round(Math.abs(q)+1e-9)*m; }
const isDeload = w => DELOAD.has(w);
const _c = new Map();
function clearCache(){ _c.clear(); }
function memo(key, fn){ if(_c.has(key)) return _c.get(key); const v=fn(); _c.set(key,v); return v; }

/* Hauptübungen: TM vor dem Single der Woche */
function stepFor(k,n){
  const s=LIFTS[k];
  if(n-s.lower<=-2) return STEP.b2;
  if(n-s.lower<=-1) return STEP.b1;
  if(n-s.upper>=2) return STEP.a2;
  if(n-s.upper>=1) return STEP.a1;
  return 0;
}
function tmBase(k,w){
  return memo("b"+k+w, ()=>{
    if(w===1) return has(S.max[k])?Number(S.max[k]):null;
    let t=tm(k,w-1); if(t===null) return null;
    const prev=getL(w-1,k);
    if(!isDeload(w-1) && has(prev.sets)) t=t*(1+stepFor(k,Number(prev.sets)));
    return t;
  });
}
function tm(k,w){
  return memo("t"+k+w, ()=>{ const l=getL(w,k); return has(l.single)?Number(l.single)/S.pct:tmBase(k,w); });
}
function presc(k,w){
  const s=LIFTS[k], T=s.type==="main"?MAIN_T:VAR_T, t=tm(k,w), dl=isDeload(w);
  const int=dl?DL.int:T.i[w-1];
  return { tm:t, int, weight:t===null?null:mround(t*int/100,S.rounding), reps:dl?DL.reps:T.r[w-1],
           rir:dl?null:T.q[w-1], lower:dl?DL.sets:s.lower, upper:dl?DL.sets:s.upper, deload:dl };
}
function nextChange(k,w){
  const l=getL(w,k); if(!has(l.sets)) return null;
  if(isDeload(w)) return {cls:"keep", txt:"Deload – TM bleibt unverändert"};
  const n=Number(l.sets), s=LIFTS[k], st=stepFor(k,n);
  if(st>0) return {cls:"up",   txt:`${n} Sätze > ${s.upper} → TM nächste Woche +${fmtPct(st)}`};
  if(st<0) return {cls:"down", txt:`${n} Sätze < ${s.lower} → TM nächste Woche ${fmtPct(st)}`};
  return {cls:"keep", txt:`${n} Sätze im Zielbereich → TM bleibt`};
}

/* Hypertrophie: Doppelprogression */
function nextW(W){ const r=S.rounding, a=mround(W*1.025,r); return a>W+r?a:W+r; }
function hyp(k,w){
  return memo("h"+k+w, ()=>{
    let base, reps;
    if(w===1){ base=has(S.hypStart[k])?Number(S.hypStart[k]):null; reps=8; }
    else{
      const p=hyp(k,w-1), l=getL(w-1,k); base=p.weight; reps=p.reps;
      if(!isDeload(w-1) && l.ok==="ja"){ if(p.reps<10) reps=p.reps+1; else { reps=8; if(base!==null) base=nextW(base); } }
    }
    const l=getL(w,k), weight=has(l.weight)?Number(l.weight):base;
    const sets=isDeload(w)?Math.ceil(HYP[k].sets/2):HYP[k].sets;
    return {base, weight, reps, sets, own:has(l.weight)};
  });
}
function hypNext(k,w){
  const h=hyp(k,w), l=getL(w,k);
  if(isDeload(w)) return {cls:"keep", txt:"Deload – Sätze halbiert, keine Steigerung"};
  if(l.ok==="ja"){
    if(h.reps<10) return {cls:"up", txt:`Nächste Woche: ${h.sets} × ${h.reps+1} Wdh.`};
    return {cls:"up", txt:h.weight===null?"Nächste Woche: mehr Gewicht, wieder 8 Wdh.":`Nächste Woche: ${fmtKg(nextW(h.weight))} kg × 8 Wdh.`};
  }
  if(l.ok==="nein") return {cls:"keep", txt:"Nächste Woche: gleiche Vorgabe"};
  return null;
}

/* Klimmzüge mit Band: erst Sätze 3 → 5, dann +1 Wdh. und zurück auf 3 Sätze */
function pull(w){
  return memo("p"+w, ()=>{
    if(w===1) return {sets:3, reps:Number(S.pullStart)||6};
    const p=pull(w-1), l=getL(w-1,"pull"); let sets=p.sets, reps=p.reps;
    if(!isDeload(w-1) && l.ok==="ja"){ if(p.sets<5) sets=p.sets+1; else { sets=3; reps=p.reps+1; } }
    return {sets, reps};
  });
}
function pullNext(w){
  const p=pull(w), l=getL(w,"pull");
  if(isDeload(w)) return {cls:"keep", txt:"Deload – Sätze halbiert, keine Steigerung"};
  if(l.ok==="ja") return {cls:"up", txt:p.sets<5?`Nächste Woche: ${p.sets+1} × ${p.reps}`:`Nächste Woche: 3 × ${p.reps+1}`};
  if(l.ok==="nein") return {cls:"keep", txt:"Nächste Woche: gleiche Vorgabe"};
  return null;
}
/* letzter eingetragener Wert (für Platzhalter, z. B. Bandfarbe, Körpergewicht) */
function lastVal(k,f,w){ for(let i=w-1;i>=1;i--){ const v=getL(i,k)[f]; if(has(v)) return v; } return ""; }

/* ============================================================
   Formatierung
   ============================================================ */
const fmtKg = x => x===null||isNaN(x) ? "–" : (Math.round(x*100)/100).toLocaleString("de-DE",{maximumFractionDigits:2});
const fmtTM = x => x===null||isNaN(x) ? "–" : x.toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1});
const fmtPct = x => (Math.round(x*10000)/100).toLocaleString("de-DE")+" %";
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const wDate = w => { const d=new Date(START); d.setDate(d.getDate()+7*(w-1)); return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"}); };
function dayDone(w,d){ return !!S.done[`${w}-${d}`]; }
function currentSession(){
  for(let w=1;w<=WEEKS;w++) for(let d=0;d<ND;d++) if(!dayDone(w,d)) return {week:w,day:d};
  return {week:WEEKS, day:ND-1, finished:true};
}
const doneCount = () => Object.values(S.done).filter(Boolean).length;

/* ============================================================
   Render: Kopfzeile
   ============================================================ */
function renderHeader(){
  const w=S.ui.week, d=S.ui.day;
  document.getElementById("sTitle").textContent=`Woche ${w} · ${DAYS[d].title}`;
  document.getElementById("sSub").textContent=`ab ${wDate(w)} · `+
    (isDeload(w)?"Deload-Woche":`Block ${Math.ceil(w/7)} · Hauptübungen ${fmtKg(MAIN_T.i[w-1])} %`)+(dayDone(w,d)?" · erledigt ✓":"");
  const n=doneCount();
  document.getElementById("progBar").style.width=(n/(WEEKS*ND)*100)+"%";
  document.getElementById("progTxt").textContent=`${n} / ${WEEKS*ND} Einheiten`;
  let h="";
  for(let k=1;k<=WEEKS;k++){
    const all=DAYS.every((_,x)=>dayDone(k,x));
    h+=`<button class="wk ${k===w?"on":""} ${isDeload(k)?"deload":""}" data-w="${k}">${k}${all?'<span class="dot"></span>':""}</button>`;
  }
  const wEl=document.getElementById("weeks"); wEl.innerHTML=h;
  if(!document.getElementById("picker").classList.contains("hidden")){ const on=wEl.querySelector(".on"); if(on) on.scrollIntoView({inline:"center",block:"nearest"}); }
  document.getElementById("days").innerHTML=DAYS.map((x,i)=>
    `<button class="day ${i===d?"on":""}" data-d="${i}">${x.short}${dayDone(w,i)?" ✓":""}</button>`).join("");
}

/* ============================================================
   Render: Karten
   ============================================================ */
const restBtn = (s,txt) => `<button class="chip restchip" data-rest="${s}">⏱ Pause ${txt}</button>`;

function painField(k,w){
  const v=getL(w,k).pain;
  let fb="";
  if(has(v)){
    const n=Number(v);
    fb = n<=3 ? `<div class="prog up">Knie ${n}/10 – alles im grünen Bereich</div>`
       : n<=5 ? `<div class="prog warn">Knie ${n}/10 – ok, wenn es bis morgen früh abgeklungen ist</div>`
       :        `<div class="prog down">Knie ${n}/10 – Last oder Bewegungstiefe reduzieren</div>`;
  }
  let b="";
  for(let i=0;i<=10;i++) b+=`<button class="pain p${i<=3?"g":i<=5?"y":"r"} ${has(v)&&Number(v)===i?"on":""}" data-pain="${k}" data-v="${i}">${i}</button>`;
  return `<div class="stage">Knie-Schmerz (0–10)</div><div class="painrow">${b}</div>${fb}`;
}
function notes(k,w){
  const l=getL(w,k);
  return `<details class="more" ${has(l.notes)?"open":""}><summary>Notizen</summary>
    <div class="f" style="margin-top:6px"><textarea data-k="${k}" data-f="notes" rows="2" aria-label="Notizen">${esc(l.notes??"")}</textarea></div></details>`;
}
/* Gewicht & Wdh. pro Satz – leere Felder zeigen grau die Vorgabe bzw. den Wert des Satzes davor */
function setTable(k,w,n,defW,defR,bw){
  const l=getL(w,k), sw=l.sw||[], sr=l.sr||[];
  let rows="", lastW=defW, vol=0, cnt=0;
  for(let i=0;i<n;i++){
    const phW = has(lastW)&&lastW!==null ? fmtKg(lastW).replace(",",".") : "kg";
    rows+=`<div class="setrow"><span class="sn">${i+1}</span>
      <div class="f"><input type="number" inputmode="decimal" step="any" data-k="${k}" data-f="sw.${i}" value="${esc(sw[i]??"")}" placeholder="${bw&&!lastW?"KG":phW}" aria-label="Satz ${i+1} Gewicht"></div>
      <span class="unit">kg</span>
      <div class="f"><input type="number" inputmode="numeric" data-k="${k}" data-f="sr.${i}" value="${esc(sr[i]??"")}" placeholder="${esc(defR)}" aria-label="Satz ${i+1} Wdh."></div>
      <span class="unit">Wdh.</span></div>`;
    if(has(sw[i])) lastW=Number(sw[i]);
    const wv=has(sw[i])?Number(sw[i]):(lastW||0);
    if(has(sr[i])){ vol+=wv*Number(sr[i]); cnt++; }
  }
  return `<div class="settable">${rows}</div>${cnt?`<div class="hint">${cnt} Sätze eingetragen · Volumen ${fmtKg(vol)} kg</div>`:`<div class="hint">Leer = graue Vorgabe. Gewicht eintragen, wenn es von Satz zu Satz abweicht.</div>`}`;
}
function stepper(k,val){
  return `<div class="stepper"><button data-step="${k}" data-d="-1" aria-label="weniger">−</button>
    <div class="n">${has(val)?val:"–"}</div><button data-step="${k}" data-d="1" aria-label="mehr">+</button></div>`;
}
function yesNo(k,w){
  const v=getL(w,k).ok;
  return `<div class="sets"><div class="lbl">Alle Sätze geschafft?</div>
    <div class="yn"><button class="btn ${v==="ja"?"primary":""}" data-ok="${k}" data-v="ja">ja</button>
    <button class="btn ${v==="nein"?"on-no":""}" data-ok="${k}" data-v="nein">nein</button></div></div>`;
}

function liftCard(k,w){
  const s=LIFTS[k], p=presc(k,w), l=getL(w,k);
  const sets=has(l.sets)?Number(l.sets):0, nc=nextChange(k,w);
  const base=tmBase(k,w);
  if(p.tm===null){
    return `<div class="card"><div class="c-head"><div class="c-name">${esc(s.name)}</div></div>
      <div class="banner" style="margin-top:10px">Noch kein Trainingsmax. Arbeite dich zu einem schweren Einzelversuch hoch, bei dem noch 2 Wdh. drin wären (Single @8), und trag das Gewicht ein – oder hinterlege das TM im Setup.</div>
      <div class="stage"><span class="num">1</span>Single @8</div>
      <div class="single-row"><div class="f" style="flex:1"><input type="number" inputmode="decimal" step="any" data-k="${k}" data-f="single" value="${esc(l.single??"")}" placeholder="kg" aria-label="Single @8 in kg"></div><span class="unit">kg</span></div>
    </div>`;
  }
  let dots=""; const maxDots=Math.max(p.upper,sets);
  for(let i=1;i<=maxDots;i++) dots+=`<span class="${i<=sets?(i>p.upper?"over":"f"):""}"></span>`;
  const target=mround(base*S.pct,S.rounding);
  const singleInfo = has(l.single)
    ? `<div class="prog keep">Neues TM ${fmtTM(p.tm)} kg → Arbeitsgewicht ${fmtKg(p.weight)} kg</div>`
    : `<div class="hint">Optional: Single @8 eintragen (noch 2 Wdh. im Tank). Erwartet ca. <b>${fmtKg(target)} kg</b> – TM und Arbeitsgewicht passen sich dann an.</div>`;
  return `
  <div class="card ${has(l.sets)&&(p.deload||sets>=p.lower)?"done":""}">
    <div class="c-head"><div class="c-name">${esc(s.name)}</div><div class="c-tm">TM ${fmtTM(p.tm)}</div></div>
    ${s.note?`<div class="hint">${esc(s.note)}</div>`:""}
    <details class="more" ${has(l.single)?"open":""}><summary>Single @8 (optional)</summary>
      <div class="single-row" style="margin-top:6px">
        <div class="f" style="flex:1"><input type="number" inputmode="decimal" step="any" data-k="${k}" data-f="single" value="${esc(l.single??"")}" placeholder="z. B. ${fmtKg(target)}" aria-label="Single @8 in kg"></div>
        <span class="unit">kg</span>
        ${has(l.single)?`<button class="btn" data-clear="${k}" data-f="single" aria-label="Single löschen" style="height:44px">✕</button>`:""}
      </div>${singleInfo}
    </details>
    <div class="presc"><span class="w">${fmtKg(p.weight)}<small>kg</small></span><span class="x">×</span><span class="r">${p.reps}</span></div>
    <div class="chips">
      ${p.deload?`<span class="chip"><b>Deload</b> · ${DL.sets} lockere Sätze</span>`
        :`<span class="chip">RIR-Grenze <b>${p.rir}</b></span><span class="chip">Ziel <b>${p.lower}–${p.upper}</b> Sätze</span>`}
      <span class="chip">${fmtKg(p.int)} % TM</span>${restBtn(s.rest,s.restTxt)}
    </div>
    <div class="setdots">${dots}</div>
    <div class="sets">
      <div class="lbl">Sätze geschafft<br><span class="hint">${p.deload?"Deload: zählt nicht fürs TM":"Sätze, bis die RIR-Grenze erreicht ist"}</span></div>
      ${stepper(k,l.sets)}
    </div>
    ${nc?`<div class="prog ${nc.cls}">${nc.txt}</div>`:""}
    <details class="more" ${(l.sw||[]).some(has)||(l.sr||[]).some(has)?"open":""}><summary>Gewicht pro Satz</summary>
      ${setTable(k,w,Math.max(p.upper,sets),p.weight,p.reps)}
    </details>
    ${s.knee?painField(k,w):""}
    ${notes(k,w)}
  </div>`;
}

function hypCard(k,w){
  const s=HYP[k], h=hyp(k,w), l=getL(w,k), nx=hypNext(k,w);
  const wTxt = s.bw && (h.weight===0||h.weight===null) ? `<span class="w" style="font-size:24px">Körpergewicht</span>`
             : h.weight===null ? `<span class="w" style="font-size:22px;color:var(--muted)">Startgewicht?</span>`
             : `<span class="w">${fmtKg(h.weight)}<small>kg</small></span>`;
  return `
  <div class="card ${has(l.ok)?"done":""}">
    <div class="c-head"><div class="c-name">${esc(s.name)}</div><div class="c-tm">8–10 Wdh.</div></div>
    <div class="presc">${wTxt}<span class="x">·</span><span class="r">${h.sets} × ${h.reps}</span></div>
    <div class="chips"><span class="chip">RIR <b>0–2</b></span>${isDeload(w)?`<span class="chip"><b>Deload</b> · Sätze halbiert</span>`:""}${restBtn(90,"90 s")}</div>
    <div class="f" style="margin-top:12px"><label>${h.weight===null&&w===1?"Startgewicht (kg)":"Arbeitsgewicht ändern (kg)"}${s.bw?" · Zusatzlast":""}</label>
      <input type="number" inputmode="decimal" step="any" data-k="${k}" data-f="weight" value="${h.own?esc(l.weight):""}" placeholder="${h.weight===null?"kg":fmtKg(h.weight)}"></div>
    <div class="stage">Gewicht & Wdh. pro Satz</div>
    ${setTable(k,w,h.sets,h.weight,h.reps,s.bw)}
    ${isDeload(w)?"":yesNo(k,w)}
    ${nx?`<div class="prog ${nx.cls}">${nx.txt}</div>`:""}
    ${notes(k,w)}
  </div>`;
}

function pullCard(w){
  const k="pull", p=pull(w), l=getL(w,k), nx=pullNext(w);
  const sets=isDeload(w)?Math.ceil(p.sets/2):p.sets;
  const bwPh=lastVal(k,"bw",w), bandPh=lastVal(k,"band",w), maxPrev=lastVal(k,"max",w);
  return `
  <div class="card ${has(l.ok)?"done":""}">
    <div class="c-head"><div class="c-name">Klimmzüge</div>${restBtn(120,"2 min")}</div>
    <div class="stage"><span class="num">1</span>1 Satz ohne Band – max. Wdh.</div>
    <div class="grid2">
      <div class="f"><label>Körpergewicht (kg)</label><input type="number" inputmode="decimal" step="any" data-k="${k}" data-f="bw" value="${esc(l.bw??"")}" placeholder="${esc(bwPh||"kg")}"></div>
      <div class="f"><label>Wdh. ohne Band</label><input type="number" inputmode="numeric" data-k="${k}" data-f="max" value="${esc(l.max??"")}" placeholder="${maxPrev?`Vorwoche ${esc(maxPrev)}`:"Wdh."}"></div>
    </div>
    <div class="stage"><span class="num">2</span>Sätze mit Band</div>
    <div class="presc"><span class="r">${sets} × ${p.reps}</span>${isDeload(w)?`<span class="chip"><b>Deload</b></span>`:""}</div>
    <div class="f" style="margin-top:8px"><label>Bandfarbe</label><input type="text" data-k="${k}" data-f="band" value="${esc(l.band??"")}" placeholder="${esc(bandPh||"z. B. grün")}"></div>
    <div class="hint">Wird es leicht, nimm das nächst dünnere Band und trag die Farbe ein.</div>
    ${isDeload(w)?"":yesNo(k,w)}
    ${nx?`<div class="prog ${nx.cls}">${nx.txt}</div>`:""}
    ${notes(k,w)}
  </div>`;
}

function pushCard(w){
  const k="push", l=getL(w,k), prev=w>1?getL(w-1,k):{};
  const f=i=>`<div class="f"><label>Satz ${i}</label><input type="number" inputmode="numeric" data-k="${k}" data-f="r${i}" value="${esc(l["r"+i]??"")}" placeholder="${has(prev["r"+i])?esc(prev["r"+i]):"Wdh."}"></div>`;
  const tot=[1,2,3].reduce((a,i)=>a+(Number(l["r"+i])||0),0), ptot=[1,2,3].reduce((a,i)=>a+(Number(prev["r"+i])||0),0);
  return `
  <div class="card ${tot?"done":""}">
    <div class="c-head"><div class="c-name">Liegestütze</div><div class="c-tm">Unterstützung Bank</div></div>
    <div class="presc"><span class="r">3 × max.</span></div>
    <div class="chips"><span class="chip">explosiv · maximale Wdh.</span>${restBtn(120,"2 min")}</div>
    <div class="grid3" style="margin-top:12px">${f(1)}${f(2)}${f(3)}</div>
    ${tot?`<div class="prog ${ptot&&tot>ptot?"up":"keep"}">Gesamt ${tot} Wdh.${ptot?` (Vorwoche ${ptot})`:""}</div>`:""}
    ${notes(k,w)}
  </div>`;
}

function stCard(id,w){
  const s=ST[id], l=getL(w,id);
  return `
  <div class="card ${l.done?"done":""}">
    <div class="c-head"><div class="c-name">${esc(s.name)}</div>
      <button class="btn ${l.done?"primary":""}" data-done="${id}" style="height:40px;padding:0 12px">${l.done?"✓":"Erledigt"}</button></div>
    <div class="presc"><span class="r">${s.presc}</span></div>
    <div class="chips">${s.tip?`<span class="chip">${esc(s.tip)}</span>`:""}${isDeload(w)?`<span class="chip"><b>Deload</b> · Sätze halbieren</span>`:""}${restBtn(s.rest,s.restTxt)}</div>
    ${s.res?`<div class="f" style="margin-top:12px"><label>${s.res}</label><input type="number" inputmode="decimal" step="any" data-k="${id}" data-f="res" value="${esc(l.res??"")}" placeholder="${esc(lastVal(id,"res",w)||"")}"></div>`:""}
    ${s.knee?painField(id,w):""}
    ${notes(id,w)}
  </div>`;
}

function renderTrain(){
  const w=S.ui.week, d=S.ui.day, cur=currentSession(), day=DAYS[d];
  const isCur=cur.week===w&&cur.day===d;
  let h="";
  if(cur.finished&&isCur) h+=`<div class="banner">🎉 Alle 21 Wochen geschafft!</div>`;
  else if(!isCur) h+=`<div class="banner">Du schaust gerade Woche ${w} · ${day.title} an. <button class="linkbtn" id="toCurrent">Zur nächsten offenen Einheit (W${cur.week} · ${DAYS[cur.day].short}) →</button></div>`;
  if(d>=2) h+=`<div class="banner">Gymtage frei legen: mind. 1 Tag zwischen Gym A und Gym B, Gym B (Kreuzheben) möglichst nicht direkt vor Montag.</div>`;
  h+=`<div class="hint" style="margin-top:12px">${esc(day.sub)}</div>`;
  let sec="";
  day.items.forEach(it=>{
    if(it[0]!==sec){ sec=it[0]; h+=`<div class="section-title">${esc(sec)}</div>`; }
    if(it[1]==="lift") h+=liftCard(it[2],w);
    else if(it[1]==="hyp") h+=hypCard(it[2],w);
    else if(it[1]==="st") h+=stCard(it[2],w);
    else if(it[1]==="pull") h+=pullCard(w);
    else if(it[1]==="push") h+=pushCard(w);
  });
  h+= dayDone(w,d)
    ? `<div class="finish done-state"><div><b>Einheit abgeschlossen ✓</b></div><button class="btn" id="reopenBtn">Wieder öffnen</button></div>`
    : `<div class="finish"><button class="btn primary big" id="finishBtn">Einheit abschließen ✓</button></div>`;
  document.getElementById("viewTrain").innerHTML=h;
}

/* ============================================================
   Render: Übersicht
   ============================================================ */
function renderOverview(){
  let h=`<div class="section-title">Hauptübungen – Arbeitsgewicht × Wdh.</div><div class="card overview-scroll"><table class="week-table"><tr><th>Wo</th>`;
  const keys=["squat","bench","dead","ohp","pp","ext","curl"];
  const short={squat:"KB",bench:"Bank",dead:"KH",ohp:"OHP",pp:"PP",ext:"BStr",curl:"BBeu"};
  keys.forEach(k=>h+=`<th>${short[k]}</th>`); h+=`</tr>`;
  for(let w=1;w<=WEEKS;w++){
    h+=`<tr${w===S.ui.week?' class="cur"':""}><td>${w}${isDeload(w)?" D":""}</td>`;
    keys.forEach(k=>{ const p=presc(k,w); h+=`<td>${p.weight===null?"–":fmtKg(p.weight)+"×"+p.reps}</td>`; });
    h+=`</tr>`;
  }
  h+=`</table><div class="hint">KB Kniebeuge · KH Kreuzheben · PP Push Press · BStr Beinstrecker · BBeu Beinbeuger · D = Deload. Spätere Wochen passen sich an, sobald Sätze eingetragen sind.</div></div>`;

  h+=`<div class="section-title">Hypertrophie & Klimmzüge</div><div class="card overview-scroll"><table class="week-table"><tr><th>Wo</th>`;
  Object.values(HYP).forEach(s=>h+=`<th>${s.name}</th>`); h+=`<th>Klimmz.</th></tr>`;
  for(let w=1;w<=WEEKS;w++){
    h+=`<tr${w===S.ui.week?' class="cur"':""}><td>${w}</td>`;
    Object.keys(HYP).forEach(k=>{ const x=hyp(k,w); h+=`<td>${x.weight===null?"–":(HYP[k].bw&&!x.weight?"KG":fmtKg(x.weight))}×${x.reps}</td>`; });
    const p=pull(w); h+=`<td>${p.sets}×${p.reps}</td></tr>`;
  }
  h+=`</table></div>`;

  const kneeKeys=["squat","dead","ext","curl",...Object.keys(ST).filter(k=>ST[k].knee)];
  h+=`<div class="section-title">Knie-Schmerz pro Woche</div><div class="card overview-scroll"><table class="week-table"><tr><th>Wo</th><th>Max</th><th>Ø</th><th>Einträge</th></tr>`;
  let any=false;
  for(let w=1;w<=WEEKS;w++){
    const v=kneeKeys.map(k=>getL(w,k).pain).filter(has).map(Number);
    if(!v.length) continue; any=true;
    const mx=Math.max(...v), av=v.reduce((a,b)=>a+b,0)/v.length;
    h+=`<tr><td>${w}</td><td class="${mx>5?"tdown":mx>3?"twarn":"tup"}">${mx}</td><td>${av.toLocaleString("de-DE",{maximumFractionDigits:1})}</td><td>${v.length}</td></tr>`;
  }
  if(!any) h+=`<tr><td colspan="4" style="text-align:left;color:var(--faint)">Noch keine Einträge</td></tr>`;
  h+=`</table></div>`;
  document.getElementById("viewOverview").innerHTML=h;
}

/* ============================================================
   Render: Setup
   ============================================================ */
function renderSetup(){
  let h=`<div class="section-title">Trainingsmaxima (kg)</div><div class="card">
    <div class="hint" style="margin-bottom:10px">Startwert fürs TM. Fehlt ein Wert, reicht auch ein Single @8 in Woche 1 (TM = Single ÷ 0,9).</div><div class="grid2">`;
  Object.entries(LIFTS).forEach(([k,s])=>h+=`<div class="f"><label>${esc(s.name)}</label><input type="number" inputmode="decimal" step="any" data-set="max.${k}" value="${esc(S.max[k])}" placeholder="offen"></div>`);
  h+=`</div><div class="hint" style="margin-top:10px">Satzziele: Kniebeuge, Kreuzheben, Push Press 3–5 · Bankdrücken, OHP, Beinstrecker, Beinbeuger 4–6. Unter dem Ziel −5 %, 1 Satz darüber +1 %, 2+ darüber +2 %.</div></div>`;
  h+=`<div class="section-title">Hypertrophie – Startgewicht Woche 1 (kg)</div><div class="card"><div class="grid2">`;
  Object.entries(HYP).forEach(([k,s])=>h+=`<div class="f"><label>${esc(s.name)} (${s.sets} Sätze)</label><input type="number" inputmode="decimal" step="any" data-set="hypStart.${k}" value="${esc(S.hypStart[k])}" placeholder="${s.bw?"0 = Körpergewicht":"offen"}"></div>`);
  h+=`</div></div>`;
  h+=`<div class="section-title">Klimmzüge & Rundung</div><div class="card"><div class="grid2">
    <div class="f"><label>Start-Wdh. mit Band</label><input type="number" inputmode="numeric" data-set="pullStart" value="${esc(S.pullStart)}"></div>
    <div class="f"><label>Rundung (kg)</label><select data-set="rounding">${[1,1.25,2.5,5].map(r=>`<option ${Number(S.rounding)===r?"selected":""} value="${r}">${fmtKg(r)}</option>`).join("")}</select></div>
  </div></div>`;
  h+=`<div class="section-title">Daten</div><div class="card">
    <div class="hint" style="margin-bottom:10px">Alles wird nur auf diesem Handy gespeichert. Ab und zu ein Backup ziehen.</div>
    <div class="row" style="flex-wrap:wrap">
      <button class="btn" id="exportBtn">Backup speichern</button>
      <label class="btn" style="display:inline-flex;align-items:center">Backup laden<input type="file" id="importInp" accept="application/json" class="hidden"></label>
      <button class="btn danger" id="resetBtn">Zurücksetzen</button>
    </div></div>`;
  document.getElementById("viewSetup").innerHTML=h;
}

/* ============================================================
   Steuerung
   ============================================================ */
function render(){
  renderHeader();
  const v=S.ui.view;
  ["Train","Overview","Setup"].forEach(x=>document.getElementById("view"+x).classList.toggle("hidden",x!==v));
  document.getElementById("trainHeader").classList.toggle("hidden",v!=="Train");
  document.querySelectorAll("nav.bottom button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  if(v==="Train") renderTrain(); else if(v==="Overview") renderOverview(); else renderSetup();
}
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),1800); }
function keepScroll(fn){ const y=window.scrollY; fn(); window.scrollTo(0,y); }

document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  const w=S.ui.week;
  if(t.dataset.w){ S.ui.week=Number(t.dataset.w); save(); render(); return; }
  if(t.dataset.d!==undefined && t.classList.contains("day")){ S.ui.day=Number(t.dataset.d); save(); render(); window.scrollTo(0,0); return; }
  if(t.id==="pickBtn"){ const p=document.getElementById("picker"); p.classList.toggle("hidden"); t.setAttribute("aria-expanded",!p.classList.contains("hidden")); renderHeader(); return; }
  if(t.dataset.v && t.closest("nav.bottom")){ S.ui.view=t.dataset.v; save(); render(); window.scrollTo(0,0); return; }
  if(t.dataset.step){ const l=L(w,t.dataset.step); const n=(has(l.sets)?Number(l.sets):0)+Number(t.dataset.d); if(n<=0) delete l.sets; else l.sets=n; if(navigator.vibrate) navigator.vibrate(15); save(); keepScroll(renderTrain); renderHeader(); return; }
  if(t.dataset.ok){ const l=L(w,t.dataset.ok); l.ok = l.ok===t.dataset.v ? undefined : t.dataset.v; save(); keepScroll(renderTrain); return; }
  if(t.dataset.pain){ const l=L(w,t.dataset.pain); const v=Number(t.dataset.v); l.pain = l.pain===v ? undefined : v; save(); keepScroll(renderTrain); return; }
  if(t.dataset.done){ const l=L(w,t.dataset.done); l.done=!l.done; save(); keepScroll(renderTrain); return; }
  if(t.dataset.clear){ delete L(w,t.dataset.clear)[t.dataset.f]; save(); keepScroll(renderTrain); return; }
  if(t.dataset.rest){ startRest(Number(t.dataset.rest)); return; }
  if(t.id==="toCurrent"){ const c=currentSession(); S.ui.week=c.week; S.ui.day=c.day; save(); render(); window.scrollTo(0,0); return; }
  if(t.id==="finishBtn"){ S.done[`${w}-${S.ui.day}`]=true; const c=currentSession(); S.ui.week=c.week; S.ui.day=c.day; save(); render(); window.scrollTo(0,0); toast("Einheit gespeichert ✓"); return; }
  if(t.id==="reopenBtn"){ delete S.done[`${w}-${S.ui.day}`]; save(); render(); return; }
  if(t.id==="themeBtn"){ const r=document.documentElement; const cur=r.dataset.theme|| (matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"); r.dataset.theme=cur==="light"?"dark":"light"; try{localStorage.setItem(KEY+".theme",r.dataset.theme);}catch(e){} return; }
  if(t.id==="exportBtn"){ const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=`lotti-kraftplan-backup-${new Date().toISOString().slice(0,10)}.json`; a.click(); return; }
  if(t.id==="resetBtn"){ if(confirm("Wirklich alle Einträge löschen?")){ S=defaultState(); save(); render(); toast("Zurückgesetzt"); } return; }
});

function setPath(path,val){ const p=path.split("."); let o=S; while(p.length>1) o=o[p.shift()]; o[p[0]]=val; }
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.k){
    const l=L(S.ui.week,t.dataset.k), v=t.value===""?undefined:(t.type==="number"?Number(t.value):t.value);
    const [f,idx]=t.dataset.f.split(".");
    if(idx!==undefined){ if(!Array.isArray(l[f])) l[f]=[]; l[f][Number(idx)]=v===undefined?null:v; }
    else if(v===undefined) delete l[f]; else l[f]=v;
    save();
    /* Platzhalter der folgenden Sätze direkt nachziehen (ohne neu zu rendern, damit die Tastatur offen bleibt) */
    if(f==="sw"){
      const box=t.closest(".settable"); let cur=t.value||t.placeholder;
      box.querySelectorAll('input[data-f^="sw."]').forEach(inp=>{
        if(Number(inp.dataset.f.split(".")[1])<=Number(idx)) return;
        if(inp.value){ cur=inp.value; return; }
        inp.placeholder=cur;
      });
    }
  }
  if(t.dataset.set){ setPath(t.dataset.set, t.value===""?"":(t.type==="number"||t.tagName==="SELECT"?Number(t.value):t.value)); save(); }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="importInp" && t.files[0]){ const r=new FileReader(); r.onload=()=>{ try{ S=JSON.parse(r.result); save(); load(); render(); toast("Backup geladen"); }catch(err){ toast("Datei nicht lesbar"); } }; r.readAsText(t.files[0]); return; }
  if(t.dataset.k && t.dataset.f.includes(".")){ return; }
  if((t.dataset.k && t.tagName!=="TEXTAREA") || t.dataset.set){ if(S.ui.view==="Train") keepScroll(renderTrain); renderHeader(); }
});

/* ============================================================
   Pausentimer – speichert das Ende, läuft also auch bei gesperrtem Handy weiter
   ============================================================ */
const fab=document.getElementById("fab"), timerEl=document.getElementById("timer");
let tInt=null, actx=null;
function beep(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.3,actx.currentTime); o.start(); o.stop(actx.currentTime+.4); }catch(e){} }
function startRest(sec){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  const end=Date.now()+sec*1000; try{localStorage.setItem(KEY+".rest",end);}catch(e){}
  timerEl.classList.remove("open"); runTimer(end); toast(`Pause ${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")} läuft`);
}
function runTimer(end){
  clearInterval(tInt); fab.classList.add("run");
  const tick=()=>{ const left=Math.round((end-Date.now())/1000);
    if(left<=0){ stopTimer(); if(navigator.vibrate) navigator.vibrate([300,150,300]); beep(); toast("Pause vorbei – nächster Satz!"); return; }
    fab.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`; };
  tick(); tInt=setInterval(tick,250);
}
function stopTimer(){ clearInterval(tInt); tInt=null; try{localStorage.removeItem(KEY+".rest");}catch(e){} fab.classList.remove("run"); fab.textContent="⏱"; }
fab.addEventListener("click",()=>{ if(tInt){ stopTimer(); return; } timerEl.classList.toggle("open"); });
timerEl.querySelectorAll(".presets button").forEach(b=>b.addEventListener("click",()=>startRest(Number(b.dataset.s))));

/* Start */
try{ const th=localStorage.getItem(KEY+".theme"); if(th) document.documentElement.dataset.theme=th; }catch(e){}
load(); render();
try{ const end=Number(localStorage.getItem(KEY+".rest")); if(end>Date.now()) runTimer(end); }catch(e){}
</script>
</body>
